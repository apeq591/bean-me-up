<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>…</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<!-- an anonymous tab. a favicon of their logo would give the game away -->
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Fredoka:wght@400;500;600&family=Caveat:wght@600;700&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   THE SCAN.

   The poster says one thing: "DON'T SCAN THIS AFTER 1PM." No logo, no name,
   no green — nothing that gives it away. This page is the only place the
   secret exists.

   Three acts:
     1. TOO LATE  — they're shut. You're told to come back. That's the hook.
     2. THE SECRET — they're open. The tubes strike on in your hand.
     3. THE WAY    — arrows to the hatch, with a skip for anyone in a hurry.

   The title is "…" on purpose. A tab that says "Bean Me Up" ruins it.
   ========================================================================= */
:root{
  --lime:#8FCB1E; --lime-lt:#B6EA4A; --lime-dk:#5C8A0F;
  --chalk:#F3F0E6; --dim:rgba(243,240,230,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#000;color:var(--chalk);
  font-family:'Bricolage Grotesque',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom));
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.act{display:none;width:min(560px,100%);text-align:center}
.act.live{display:block}

h1{
  font-size:clamp(2.1rem,9vw,3.6rem);line-height:1.02;font-weight:800;letter-spacing:-.045em;
}
.sub{margin-top:1.1rem;font-size:clamp(1rem,4vw,1.2rem);color:var(--dim);line-height:1.5}
.sub b{color:var(--lime-lt)}
.hand{font-family:'Caveat',cursive;font-weight:700;font-size:clamp(1.6rem,6.5vw,2.2rem);color:var(--lime-lt)}
.tiny{
  margin-top:2.4rem;font-family:'Fredoka',sans-serif;font-size:.6rem;letter-spacing:.2em;
  text-transform:uppercase;color:rgba(243,240,230,.28)
}

/* ---------- act 1: too late ---------- */
.count{
  margin-top:1.8rem;font-size:clamp(2.6rem,12vw,4rem);font-weight:800;letter-spacing:-.05em;
  line-height:1;font-variant-numeric:tabular-nums;
}
.count small{display:block;font-size:.6rem;font-family:'Fredoka',sans-serif;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:.6rem}

/* ---------- act 2: the secret ---------- */
.tap{
  display:inline-flex;align-items:center;gap:.6rem;margin-top:2rem;
  background:var(--lime);color:#121A03;border-radius:999px;
  padding:.95rem 1.7rem;font-weight:700;font-size:1.02rem;letter-spacing:-.01em;
  box-shadow:0 0 0 0 rgba(143,203,30,.55);animation:pulse 2.6s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(143,203,30,.5)}
  70%{box-shadow:0 0 0 22px rgba(143,203,30,0)}
  100%{box-shadow:0 0 0 0 rgba(143,203,30,0)}
}
.ghost{display:block;margin:1.1rem auto 0;font-size:.9rem;color:var(--dim);text-decoration:underline}

/* the lockup, same tubes as the site */
.neon{display:inline-flex;align-items:baseline;white-space:nowrap;line-height:1;--neon:clamp(2.2rem,11vw,3.4rem)}
.neon .caps{font-weight:800;text-transform:uppercase;letter-spacing:-.05em;font-size:var(--neon)}
.neon .low{font-family:'Fredoka',sans-serif;font-weight:500;letter-spacing:-.015em;
  font-size:calc(var(--neon) * .78);margin-left:.02em}
.neon .cupwrap{font-size:calc(var(--neon) * .78);display:inline-block;line-height:0}
.neon .cup{height:.83em;width:auto;overflow:visible;vertical-align:baseline;margin:0 .03em;
  fill:none;stroke:currentColor;stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.neon .cup .steam path{stroke-width:8;opacity:.8}
.neon span{color:#26261F}
.neon.on span{
  color:#FFF;
  text-shadow:0 0 2px rgba(255,255,255,.9),0 0 9px rgba(255,255,255,.55),
              0 0 26px rgba(226,255,170,.45),0 0 62px rgba(143,203,30,.38);
}
.neon.on .cup{filter:drop-shadow(0 0 2px rgba(255,255,255,.9)) drop-shadow(0 0 8px rgba(255,255,255,.5))
              drop-shadow(0 0 22px rgba(226,255,170,.45))}
.neon.on{animation:strike 1.5s steps(1,end) 1}
@keyframes strike{
  0%,7%{opacity:.2} 9%{opacity:1} 12%{opacity:.25}
  16%{opacity:1} 19%{opacity:.4} 24%{opacity:1} 27%{opacity:.7} 30%,100%{opacity:1}
}
@keyframes waft{0%,100%{transform:translateY(3px);opacity:.35}50%{transform:translateY(-3px);opacity:.95}}
.neon.on .cup .steam path{animation:waft 3.4s ease-in-out infinite}
.neon.on .cup .steam path:nth-child(2){animation-delay:-1.7s}

/* what appears after the tubes catch */
.after{opacity:0;transform:translateY(14px);transition:opacity .8s ease .9s,transform .8s ease .9s}
.after.in{opacity:1;transform:none}

/* ---------- act 3: the way ---------- */
#way{position:fixed;inset:0;width:100%;height:100%;display:none;text-align:left}
#way.live{display:block}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#way .veil{position:absolute;inset:0;background:
  radial-gradient(ellipse 70% 50% at 50% 42%, transparent, rgba(0,0,0,.72) 100%),
  linear-gradient(180deg,rgba(0,0,0,.6),transparent 26%,transparent 58%,rgba(0,0,0,.85))}
#way .ui{
  position:absolute;inset:0;display:flex;flex-direction:column;
  justify-content:space-between;align-items:center;
  padding:max(1.2rem,env(safe-area-inset-top)) 1.2rem max(1.4rem,env(safe-area-inset-bottom));
}
.metres{
  font-size:clamp(2.6rem,13vw,4rem);font-weight:800;letter-spacing:-.05em;line-height:1;
  text-shadow:0 2px 20px rgba(0,0,0,.9);
}
.metres small{display:block;font-family:'Fredoka',sans-serif;font-size:.6rem;font-weight:400;
  letter-spacing:.2em;text-transform:uppercase;color:rgba(243,240,230,.66);margin-top:.5rem;text-align:center}
.arrow{width:min(58vw,230px);filter:drop-shadow(0 0 26px rgba(143,203,30,.75))}
.arrow path{fill:var(--lime)}
.spin{transition:transform .18s linear}
.tell{
  max-width:26rem;text-align:center;font-size:1.02rem;font-weight:700;line-height:1.4;
  text-shadow:0 2px 14px rgba(0,0,0,.95);
}
.tell b{color:var(--lime-lt)}
.skip{
  margin-top:1rem;display:inline-block;border:1px solid rgba(243,240,230,.4);
  border-radius:999px;padding:.7rem 1.4rem;font-size:.9rem;font-weight:600;
  background:rgba(0,0,0,.4);backdrop-filter:blur(6px);
}
.note{margin-top:.7rem;font-family:'Fredoka',sans-serif;font-size:.58rem;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(243,240,230,.55)}

/* no measured turn angle, or no compass — the words do the work instead */
#way.nodir .arrow{display:none}
#way.nodir .tell{font-size:clamp(1.3rem,6vw,1.7rem);line-height:1.3;max-width:20rem}
#way.nodir .ui{justify-content:center;gap:2.2rem}

@media(prefers-reduced-motion:reduce){
  .tap{animation:none}
  .neon.on,.neon.on .cup .steam path{animation:none}
  .after{opacity:1;transform:none;transition:none}
  .spin{transition:none}
}
</style>
</head>
<body>

<!-- ===== act 1: they're shut. come back. ===== -->
<section class="act" id="late">
  <h1>Try again<br>before 1pm.</h1>
  <p class="sub" id="late-sub"></p>
  <p class="count" id="count"></p>
  <p class="tiny">That is the whole message</p>
</section>

<!-- ===== act 2: the secret ===== -->
<section class="act" id="secret">
  <p class="hand" id="welcome-back"></p>
  <h1>Let me let you in<br>on a secret.</h1>
  <button class="tap" id="go">Go on then</button>
  <p class="tiny">You have until <span id="until">1pm</span></p>
</section>

<!-- ===== act 2b: the tubes catch ===== -->
<section class="act" id="reveal">
  <span class="neon" id="neon" role="img" aria-label="Bean Me Up"><span class="caps">Bean</span><span class="low">me</span><span class="cupwrap"><svg class="cup" viewBox="-4 0 76 121" aria-hidden="true"><g class="steam"><path d="M22 34C9 19 33 9 21-6 15-14 25-19 22-25"/><path d="M48 34C36 21 58 12 47-1 42-8 50-12 47-17"/></g><path d="M4 50 10 90a24 24 0 0 0 48 0L64 50"/></svg></span><span class="low">p</span></span>
  <div class="after" id="after">
    <p class="sub" id="behind"></p>
    <button class="tap" id="show">Show me</button>
    <button class="ghost" id="straight">I'm in a hurry — just show me the menu</button>
  </div>
</section>

<!-- ===== act 3: the way ===== -->
<div id="way">
  <video id="cam" playsinline muted autoplay></video>
  <div class="veil"></div>
  <div class="ui">
    <p class="metres"><span id="dist">40</span>m<small id="dist-label">to go</small></p>
    <svg class="arrow spin" id="arrow" viewBox="0 0 100 120" aria-hidden="true">
      <path d="M50 2 96 60H72v56H28V60H4z"/>
    </svg>
    <div>
      <p class="tell" id="tell"></p>
      <button class="skip" id="skip">I've found it — show me the menu</button>
      <p class="note" id="cam-note"></p>
    </div>
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/clock.js"></script>
<script src="assets/scan.js"></script>
</body>
</html>
