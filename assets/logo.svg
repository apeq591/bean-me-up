<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Bean Me Up">
  <defs>
    <linearGradient id="beam" x1="60" y1="2" x2="60" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F0E4" stop-opacity="0"/>
      <stop offset="1" stop-color="#F0A63C" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="bn" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#B87C49"/>
      <stop offset=".42" stop-color="#7C4B23"/>
      <stop offset=".85" stop-color="#4A2A12"/>
      <stop offset="1" stop-color="#2C190A"/>
    </radialGradient>
  </defs>

  <!-- short transporter beam: enough to read the pun, not enough to shrink the bean -->
  <path d="M50 54 L56 8 h8 l6 46 z" fill="url(#beam)"/>

  <!-- the bean does the work at small sizes -->
  <g transform="translate(60 76) rotate(-20)">
    <ellipse rx="46" ry="31" fill="url(#bn)"/>
    <path d="M-35 -2 C -13 15, 13 -15, 35 2"
          fill="none" stroke="#190C04" stroke-opacity=".9"
          stroke-width="9" stroke-linecap="round"/>
    <path d="M-31 -17 A 39 26 0 0 1 5 -28"
          fill="none" stroke="#FFE2BE" stroke-opacity=".3"
          stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
