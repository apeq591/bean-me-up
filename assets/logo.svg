<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Bean Me Up">
  <defs>
    <linearGradient id="beam" x1="60" y1="4" x2="60" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7EDE0" stop-opacity="0"/>
      <stop offset=".6" stop-color="#F0C98A" stop-opacity=".7"/>
      <stop offset="1" stop-color="#E0A85C" stop-opacity=".9"/>
    </linearGradient>
    <radialGradient id="bean" cx=".36" cy=".3" r=".82">
      <stop offset="0" stop-color="#A87142"/>
      <stop offset=".45" stop-color="#7C4B23"/>
      <stop offset=".85" stop-color="#4A2A12"/>
      <stop offset="1" stop-color="#311C0B"/>
    </radialGradient>
  </defs>

  <!-- the beam it gets pulled up into -->
  <path d="M48 74 L55 6 h10 l7 68 z" fill="url(#beam)"/>

  <!-- coffee bean, crease along the long axis -->
  <g transform="translate(60 82) rotate(-18)">
    <ellipse rx="38" ry="25" fill="url(#bean)"/>
    <path d="M-29 -2 C -11 12, 11 -12, 29 2"
          fill="none" stroke="#1C0E05" stroke-opacity=".85"
          stroke-width="7" stroke-linecap="round"/>
    <path d="M-26 -14 A 32 21 0 0 1 4 -23"
          fill="none" stroke="#FFE2BE" stroke-opacity=".28"
          stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
