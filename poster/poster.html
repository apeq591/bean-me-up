<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Poster — don't scan this after 1pm</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Fredoka:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================================
   THE POSTER. A3 portrait, 297 x 420mm.

   One sentence, one code, nothing else. No logo, no name, no green, no
   coffee. The whole idea dies the moment it explains itself — the secret
   only exists on the phone.

   The one concession: a small line at the foot. An unbranded QR in a railway
   station is exactly what a scam looks like, and people have been trained to
   distrust them. So the poster answers that fear in a way that makes the
   mystery worse rather than better.
   ========================================================================= */
@page{size:A3 portrait;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#fff}
.sheet{
  width:297mm;height:420mm;background:#000;color:#F3F0E6;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:34mm 24mm 22mm;
  font-family:'Bricolage Grotesque',system-ui,sans-serif;
}
h1{
  font-size:40mm;line-height:.92;font-weight:800;letter-spacing:-.045em;
  text-align:center;text-wrap:balance;
}
.code{
  background:#fff;padding:9mm;border-radius:3mm;
  width:112mm;height:112mm;display:flex;align-items:center;justify-content:center;
}
.code img{width:100%;height:100%;display:block}
.foot{
  font-family:'Fredoka',sans-serif;font-weight:500;
  font-size:13mm;letter-spacing:0;text-align:center;
  color:rgba(243,240,230,.92);line-height:1.35;max-width:250mm;
}
</style>
</head>
<body>
  <div class="sheet">
    <h1>Don't scan this after&nbsp;1pm.</h1>
    <div class="code"><img src="qr-barriers.svg" alt=""></div>
    <p class="foot">Yes, it's safe.<br>No, we're not telling you what it is.</p>
  </div>
</body>
</html>
